<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Конвертер валют</title>

<style>
body{
    font-family: Arial, sans-serif;
    height:100vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;

    background: radial-gradient(circle at 20% 20%, #ffd6e0, transparent 40%),
                radial-gradient(circle at 80% 30%, #cdb4db, transparent 45%),
                radial-gradient(circle at 50% 80%, #bde0fe, transparent 40%),
                #f8f9fb;
}

.card{
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(15px);
    padding:30px;
    border-radius:20px;
    width:420px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    margin-bottom:10px;
}

input, select, button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:16px;
}

button{
    background:#6c5ce7;
    color:white;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
    <h1>💱 Конвертер валют</h1>

    <input type="number" id="amount" placeholder="Введите сумму">

    <select id="from"></select>
    <select id="to"></select>

    <button onclick="convert()">Конвертировать</button>

    <div id="result"></div>
</div>

<script>

let rates = {};

async function loadRates(){
    const res = await fetch("https://api.exchangerate-api.com/v4/latest/USD");
    const data = await res.json();

    rates = data.rates;

    let from = document.getElementById("from");
    let to = document.getElementById("to");

    for(let currency in rates){
        let option1 = document.createElement("option");
        option1.value = currency;
        option1.text = currency;

        let option2 = option1.cloneNode(true);

        from.appendChild(option1);
        to.appendChild(option2);
    }

    from.value = "USD";
    to.value = "KZT";
}

function convert(){
    let amount = document.getElementById("amount").value;
    let from = document.getElementById("from").value;
    let to = document.getElementById("to").value;

    if(amount === ""){
        document.getElementById("result").innerText = "Введите сумму";
        return;
    }

    let usd = amount / rates[from];
    let result = usd * rates[to];

    document.getElementById("result").innerText =
        `${amount} ${from} = ${result.toFixed(2)} ${to}`;
}

loadRates();

</script>

</body>
</html>
